name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        type: choice
        options: [build, keygen]
        default: build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      DO_BUILD: ${{ github.event_name == 'push' || inputs.action == 'build' }}
      DO_KEYGEN: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'keygen' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate signing key
        if: env.DO_KEYGEN == 'true'
        run: |
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.keystore -alias coffee \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Coffee Tracker, OU=Dev, O=Coffee, C=RU"
          base64 -w0 release.keystore > keystore-base64.txt
          {
            echo "KEYSTORE_BASE64:"; cat keystore-base64.txt; echo; echo
            echo "KEYSTORE_PASSWORD: $STORE_PASS"; echo
            echo "KEY_ALIAS: coffee"; echo
            echo "KEY_PASSWORD: $KEY_PASS"; echo
            echo "HRANI ETOT FAIL I release.keystore V NADYOZHNOOM MESTE"
          } > SECRETS.txt

      - name: Upload signing key
        if: env.DO_KEYGEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            release.keystore
            keystore-base64.txt
            SECRETS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Generate app icons
        if: env.DO_BUILD == 'true'
        run: |
          cat > gen_icons.py << 'PY'
          import zlib,struct,os,math
          def chunk(t,d):
              c=struct.pack('>I',len(d))+t+d
              return c+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          def png(w,h,px):
              raw=b''.join(b'\x00'+bytes(px[y*w*4:(y+1)*w*4]) for y in range(h))
              return (b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))
                      +chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b''))
          def draw(s):
              px=bytearray(s*s*4)
              bg=(36,31,27,255);cup=(232,224,214,255);cof=(194,154,107,255);sau=(169,126,79,255);stm=(143,133,122,255)
              def put(x,y,c):
                  if 0<=x<s and 0<=y<s:
                      i=(y*s+x)*4;px[i:i+4]=bytes(c)
              def rr(x0,y0,x1,y1,r,c):
                  for y in range(int(y0),int(y1)):
                      for x in range(int(x0),int(x1)):
                          dx=max(x0+r-x,0,x-(x1-r));dy=max(y0+r-y,0,y-(y1-r))
                          if dx*dx+dy*dy<=r*r:put(x,y,c)
              rr(0,0,s,s,0.22*s,bg)
              rr(0.38*s,0.20*s,0.42*s,0.34*s,0.02*s,stm)
              rr(0.52*s,0.18*s,0.56*s,0.34*s,0.02*s,stm)
              cx,cy,R,t=0.70*s,0.56*s,0.11*s,0.035*s
              for y in range(int(0.40*s),int(0.72*s)):
                  for x in range(int(0.66*s),int(0.86*s)):
                      d=math.hypot(x-cx,y-cy)
                      if abs(d-R)<t and x>=cx:put(x,y,cup)
              rr(0.30*s,0.40*s,0.66*s,0.80*s,0.10*s,cup)
              rr(0.30*s,0.40*s,0.66*s,0.47*s,0.05*s,cof)
              rr(0.24*s,0.82*s,0.76*s,0.87*s,0.025*s,sau)
              return px
          for d,s in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              p='app/src/main/res/'+d
              os.makedirs(p,exist_ok=True)
              open(p+'/ic_launcher.png','wb').write(png(s,s,draw(s)))
          open('rustore-icon-512.png','wb').write(png(512,512,draw(512)))
          print('icons ok')
          PY
          python3 gen_icons.py

      - name: Create Android project
        if: env.DO_BUILD == 'true'
        run: |
          mkdir -p app/src/main/java/com/coffeetracker/app
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CoffeeTracker"
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          def vc = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
          def ksPass = System.getenv("KS_PASS") ?: ""
          def ksAlias = System.getenv("KS_ALIAS") ?: "coffee"
          def keyPass = System.getenv("KEY_PASS") ?: ""
          android {
              namespace 'com.coffeetracker.app'
              compileSdk 34
              buildToolsVersion "34.0.0"
              defaultConfig {
                  applicationId "com.coffeetracker.app"
                  minSdk 24
                  targetSdk 34
                  versionCode vc
                  versionName "1.0." + vc
              }
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword ksPass
                      keyAlias ksAlias
                      keyPassword keyPass
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="Кофе Трекер"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/coffeetracker/app/MainActivity.java << 'EOF'
          package com.coffeetracker.app;
          import android.app.*;
          import android.os.*;
          import android.webkit.*;
          import androidx.core.app.*;
          public class MainActivity extends Activity {
              WebView w;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("coffee", "Кофе", NotificationManager.IMPORTANCE_HIGH);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != 0) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }
              class Bridge {
                  @JavascriptInterface public void notify(String title, String body) {
                      try {
                          NotificationCompat.Builder nb = new NotificationCompat.Builder(MainActivity.this, "coffee")
                              .setSmallIcon(android.R.drawable.ic_dialog_info)
                              .setContentTitle(title).setContentText(body)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setVibrate(new long[]{200,100,200}).setAutoCancel(true);
                          NotificationManagerCompat.from(MainActivity.this).notify(1, nb.build());
                      } catch (Exception e) {}
                  }
              }
          }
          EOF

      - name: Setup Gradle
        if: env.DO_BUILD == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build APK
        if: env.DO_BUILD == 'true'
        run: |
          mkdir -p out
          if [ -n "$KS_B64" ]; then
            echo "Signing: RELEASE (secrets found)"
            echo "$KS_B64" | base64 -d > app/release.keystore
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk out/coffee-tracker-release.apk
          else
            echo "::warning::Секреты подписи не найдены — собран DEBUG APK. Для RuStore добавь 4 секрета."
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk out/coffee-tracker-debug.apk
          fi
          ls -la out
          test -s out/coffee-tracker-release.apk || test -s out/coffee-tracker-debug.apk

      - name: Upload APK
        if: env.DO_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coffee-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload RuStore icon
        if: env.DO_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustore-icon
          path: rustore-icon-512.png
          if-no-files-found: error

      - name: Publish Release
        if: env.DO_BUILD == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            out/*.apk
            rustore-icon-512.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
