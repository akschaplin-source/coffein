name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        type: choice
        options: [build, keygen]
        default: build

permissions:
  contents: write

jobs:
  keygen:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'keygen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate permanent signing key
        run: |
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.keystore -alias coffee \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Coffee Tracker, OU=Dev, O=Coffee, C=RU"
          base64 -w0 release.keystore > keystore-base64.txt
          {
            echo "=== ДОБАВЬ В Settings -> Secrets and variables -> Actions ==="
            echo ""
            echo "Имя секрета: KEYSTORE_BASE64"
            echo "Значение (одна строка, целиком):"
            cat keystore-base64.txt
            echo ""
            echo "Имя секрета: KEYSTORE_PASSWORD"
            echo "Значение: $STORE_PASS"
            echo ""
            echo "Имя секрета: KEY_ALIAS"
            echo "Значение: coffee"
            echo ""
            echo "Имя секрета: KEY_PASSWORD"
            echo "Значение: $KEY_PASS"
            echo ""
            echo "=== ХРАНИ ФАЙЛ И release.keystore ВНЕ GITHUB ==="
          } > SECRETS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            release.keystore
            keystore-base64.txt
            SECRETS.txt
          retention-days: 30

  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'build')
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate beautiful icons
        run: |
          cat > gen_icons.py << 'PY'
          import zlib,struct,os,math
          SS=3
          def chunk(t,d):
              c=struct.pack('>I',len(d))+t+d
              return c+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          def png(w,h,px):
              raw=b''.join(b'\x00'+bytes(px[y*w*4:(y+1)*w*4]) for y in range(h))
              return (b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))
                      +chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b''))
          def lerp(a,b,t): return tuple(int(a[i]+(b[i]-a[i])*t) for i in range(3))
          def rr(u,v,x0,y0,x1,y1,r):
              dx=max(x0+r-u,0,u-(x1-r)); dy=max(y0+r-v,0,v-(y1-r))
              return dx*dx+dy*dy<=r*r
          def render(s,mode):
              W=s*SS; buf=bytearray(W*W*4)
              def over(x,y,r,g,b,a):
                  if a<=0: return
                  i=(y*W+x)*4; da=buf[i+3]
                  if da==0:
                      buf[i]=r;buf[i+1]=g;buf[i+2]=b;buf[i+3]=a;return
                  na=a+da*(255-a)//255
                  if na==0: return
                  buf[i]=(r*a+buf[i]*da*(255-a)//255)//na
                  buf[i+1]=(g*a+buf[i+1]*da*(255-a)//255)//na
                  buf[i+2]=(b*a+buf[i+2]*da*(255-a)//255)//na
                  buf[i+3]=na
              k=0.66 if mode=='fg' else 1.0
              def uv(x,y):
                  u=(x/W-0.5)/k+0.5; v=(y/W-0.5)/k+0.5; return u,v
              if mode in ('full','store','bg'):
                  for y in range(W):
                      v=y/W
                      for x in range(W):
                          u=x/W
                          c=lerp((58,44,34),(20,16,13),(u+v)/2)
                          g=math.exp(-((u-0.32)**2+(v-0.26)**2)/0.10)*46
                          c=(min(255,int(c[0]+g)),min(255,int(c[1]+g*0.8)),min(255,int(c[2]+g*0.5)))
                          a=255
                          if mode=='full': a=255 if rr(u,v,0,0,1,1,0.22) else 0
                          if mode=='bg': a=255
                          over(x,y,c[0],c[1],c[2],a)
              if mode=='stat':
                  for y in range(W):
                      for x in range(W):
                          u,v=x/W,y/W; hit=False
                          if rr(u,v,0.295,0.40,0.665,0.80,0.10): hit=True
                          if rr(u,v,0.22,0.80,0.78,0.865,0.03): hit=True
                          d=abs(math.hypot(u-0.705,v-0.565)-0.115)
                          if d<0.036 and u>=0.695: hit=True
                          for cx0 in (0.40,0.545):
                              cx=cx0+0.022*math.sin((v-0.16)*26)
                              sl=0.022*26*math.cos((v-0.16)*26)
                              if 0.14<v<0.355 and abs(u-cx)/math.sqrt(1+sl*sl)<0.016: hit=True
                          if hit: over(x,y,255,255,255,255)
              else:
                  for y in range(int(0.78*W),int(0.95*W)):
                      for x in range(int(0.15*W),int(0.85*W)):
                          u,v=uv(x,y)
                          d=((u-0.5)/0.30)**2+((v-0.86)/0.055)**2
                          if d<1: over(x,y,0,0,0,int(110*(1-d)))
                  for y in range(int(0.76*W),int(0.90*W)):
                      for x in range(int(0.18*W),int(0.82*W)):
                          u,v=uv(x,y)
                          if rr(u,v,0.22,0.80,0.78,0.865,0.03):
                              c=lerp((196,150,102),(140,100,62),(v-0.80)/0.065)
                              over(x,y,c[0],c[1],c[2],255)
                  for y in range(int(0.40*W),int(0.72*W)):
                      for x in range(int(0.62*W),int(0.86*W)):
                          u,v=uv(x,y)
                          d=abs(math.hypot(u-0.705,v-0.565)-0.115)
                          if d<0.036 and u>=0.695:
                              c=lerp((232,222,210),(200,189,175),(u-0.66)/0.16)
                              over(x,y,c[0],c[1],c[2],255)
                  for y in range(int(0.36*W),int(0.84*W)):
                      for x in range(int(0.26*W),int(0.70*W)):
                          u,v=uv(x,y)
                          if rr(u,v,0.295,0.40,0.665,0.80,0.10):
                              c=lerp((243,236,226),(214,203,188),(v-0.40)/0.40)
                              if u<0.36: c=tuple(min(255,q+12) for q in c)
                              over(x,y,c[0],c[1],c[2],255)
                  for y in range(int(0.36*W),int(0.50*W)):
                      for x in range(int(0.26*W),int(0.70*W)):
                          u,v=uv(x,y)
                          if ((u-0.48)/0.185)**2+((v-0.435)/0.045)**2<=1:
                              c=lerp((206,164,116),(150,104,62),(u-0.30)/0.37)
                              over(x,y,c[0],c[1],c[2],255)
                  for y in range(int(0.12*W),int(0.38*W)):
                      for x in range(int(0.34*W),int(0.60*W)):
                          u,v=uv(x,y)
                          for cx0 in (0.40,0.545):
                              cx=cx0+0.022*math.sin((v-0.16)*26)
                              sl=0.022*26*math.cos((v-0.16)*26)
                              d=abs(u-cx)/math.sqrt(1+sl*sl)
                              if 0.14<v<0.355 and d<0.016:
                                  tap=max(0.0,min(1.0,min(v-0.14,0.355-v)/0.04))
                                  over(x,y,201,179,148,int(210*tap))
              out=bytearray(s*s*4); n=SS*SS
              for ty in range(s):
                  for tx in range(s):
                      sr=sg=sb=sa=0
                      for dy in range(SS):
                          row=((ty*SS+dy)*W+tx*SS)*4
                          for dx in range(SS):
                              i=row+dx*4; a=buf[i+3]
                              sr+=buf[i]*a; sg+=buf[i+1]*a; sb+=buf[i+2]*a; sa+=a
                      o=(ty*s+tx)*4
                      if sa:
                          out[o]=sr//sa; out[o+1]=sg//sa; out[o+2]=sb//sa; out[o+3]=sa//n
              return png(s,s,out)
          DENS={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,s in DENS.items():
              p='app/src/main/res/mipmap-'+d; os.makedirs(p,exist_ok=True)
              open(p+'/ic_launcher.png','wb').write(render(s,'full'))
              open(p+'/ic_launcher_foreground.png','wb').write(render(s,'fg'))
              open(p+'/ic_launcher_background.png','wb').write(render(s,'bg'))
          for d,s in {'mdpi':24,'hdpi':36,'xhdpi':48,'xxhdpi':72,'xxxhdpi':96}.items():
              p='app/src/main/res/drawable-'+d; os.makedirs(p,exist_ok=True)
              open(p+'/ic_stat_coffee.png','wb').write(render(s,'stat'))
          os.makedirs('app/src/main/res/mipmap-anydpi-v26',exist_ok=True)
          AD='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n    <monochrome android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          open('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml','w').write(AD)
          open('app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml','w').write(AD)
          open('rustore-icon-512.png','wb').write(render(512,'store'))
          print('icons ok')
          PY
          python3 gen_icons.py

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/coffeetracker/app
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CoffeeTracker"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version
